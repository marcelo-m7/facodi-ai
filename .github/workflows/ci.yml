name: CI

on:
  push:
    branches:
      - main
      - "implementation/**"
      - "fix/**"
  pull_request:

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run repository contract tests
        run: python -m unittest tests.test_repository_contract -v
      - name: Release hygiene and placeholder scan
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=__pycache__ \
            --exclude='test_repository_contract.py' \
            '(^|[^[:alnum:]_])(TODO|FIXME|CHANGEME|YOUR_[A-Z0-9_]*KEY)([^[:alnum:]_]|$)' \
            facodi_ai facodi_ai_learning facodi_ai_website README.md docs/operations.md; then
            echo "Release placeholder markers found"
            exit 1
          fi

  odoo-install-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: facodi_ai_test
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d facodi_ai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout facodi-learning dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: marcelo-m7/facodi-learning
          ref: 4c1a2886d91280247765ec778c4cd2d5c6b37ff8
          path: .ci/facodi-learning
      - name: Checkout legacy facodi-ai layout for real migration test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: marcelo-m7/facodi-ai
          ref: 756e48cc447f82280e8b9ad0958b516d0d45fc87
          path: .ci/facodi-ai-legacy
      - name: Build Odoo CI image
        run: docker build -f docker/Dockerfile.ci -t facodi-ai-ci .
      - name: Core-only install
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --network host \
            -e HOST=127.0.0.1 \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v "$PWD:/mnt/extra-addons" \
            facodi-ai-ci \
            odoo \
            --db_host=127.0.0.1 \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons \
            --database=facodi_ai_test \
            --workers=0 \
            --without-demo=True \
            --test-enable \
            --test-tags=/facodi_ai \
            --stop-after-init \
            --init=facodi_ai \
            2>&1 | tee /tmp/odoo-core-install.log
      - name: Reset database after core-only install
        shell: bash
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=odoo \
            postgres:16 \
            sh -ec 'dropdb -h 127.0.0.1 -p 5432 -U odoo --if-exists facodi_ai_test && createdb -h 127.0.0.1 -p 5432 -U odoo facodi_ai_test'
      - name: Clean install addons
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --network host \
            -e HOST=127.0.0.1 \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v "$PWD:/mnt/extra-addons" \
            facodi-ai-ci \
            odoo \
            --db_host=127.0.0.1 \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --addons-path=/mnt/extra-addons,/mnt/extra-addons/.ci/facodi-learning,/usr/lib/python3/dist-packages/odoo/addons \
            --database=facodi_ai_test \
            --workers=0 \
            --without-demo=True \
            --test-enable \
            --test-tags=/facodi_ai,/facodi_ai_learning,/facodi_ai_website \
            --stop-after-init \
            --init=facodi_ai,facodi_ai_learning,facodi_ai_website \
            2>&1 | tee /tmp/odoo-clean-install.log
      - name: Upload clean-install log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: odoo-clean-install-log
          path: /tmp/odoo-clean-install.log
          if-no-files-found: ignore
      - name: Upgrade addons
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --network host \
            -e HOST=127.0.0.1 \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v "$PWD:/mnt/extra-addons" \
            facodi-ai-ci \
            odoo \
            --db_host=127.0.0.1 \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --addons-path=/mnt/extra-addons,/mnt/extra-addons/.ci/facodi-learning,/usr/lib/python3/dist-packages/odoo/addons \
            --database=facodi_ai_test \
            --workers=0 \
            --without-demo=True \
            --test-enable \
            --test-tags=/facodi_ai,/facodi_ai_learning,/facodi_ai_website \
            --stop-after-init \
            --update=facodi_ai,facodi_ai_learning,facodi_ai_website \
            2>&1 | tee /tmp/odoo-upgrade.log
      - name: Upload upgrade log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: odoo-upgrade-log
          path: /tmp/odoo-upgrade.log
          if-no-files-found: ignore

      - name: Create bridge migration fixture database
        shell: bash
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=odoo \
            postgres:16 \
            sh -ec 'dropdb -h 127.0.0.1 -p 5432 -U odoo --if-exists facodi_ai_bridge_upgrade && createdb -h 127.0.0.1 -p 5432 -U odoo facodi_ai_bridge_upgrade'

      - name: Install legacy two-addon AI layout
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --network host \
            -e HOST=127.0.0.1 \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v "$PWD/.ci/facodi-ai-legacy:/mnt/legacy-ai" \
            -v "$PWD/.ci/facodi-learning:/mnt/facodi-learning" \
            facodi-ai-ci \
            odoo \
            --db_host=127.0.0.1 \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --addons-path=/mnt/legacy-ai,/mnt/facodi-learning,/usr/lib/python3/dist-packages/odoo/addons \
            --database=facodi_ai_bridge_upgrade \
            --workers=0 \
            --without-demo=True \
            --stop-after-init \
            --init=facodi_ai \
            2>&1 | tee /tmp/odoo-legacy-bridge-install.log

      - name: Seed legacy learning bridge rows and XML-ID identities
        shell: bash
        run: |
          docker run --rm -i --network host \
            -e HOST=127.0.0.1 \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v "$PWD/.ci/facodi-ai-legacy:/mnt/legacy-ai" \
            -v "$PWD/.ci/facodi-learning:/mnt/facodi-learning" \
            facodi-ai-ci \
            odoo shell \
            --db_host=127.0.0.1 \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --addons-path=/mnt/legacy-ai,/mnt/facodi-learning,/usr/lib/python3/dist-packages/odoo/addons \
            --database=facodi_ai_bridge_upgrade \
            < scripts/ci_seed_learning_bridge_upgrade.py

      - name: Upgrade core and install learning bridge in one registry transition
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --network host \
            -e HOST=127.0.0.1 \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v "$PWD:/mnt/current-ai" \
            -v "$PWD/.ci/facodi-learning:/mnt/facodi-learning" \
            facodi-ai-ci \
            odoo \
            --db_host=127.0.0.1 \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --addons-path=/mnt/current-ai,/mnt/facodi-learning,/usr/lib/python3/dist-packages/odoo/addons \
            --database=facodi_ai_bridge_upgrade \
            --workers=0 \
            --without-demo=True \
            --test-enable \
            --test-tags=/facodi_ai_learning \
            --stop-after-init \
            --update=facodi_ai \
            --init=facodi_ai_learning \
            2>&1 | tee /tmp/odoo-learning-bridge-upgrade.log

      - name: Verify bridge rows and XML IDs survived migration
        shell: bash
        run: |
          docker run --rm -i --network host \
            -e HOST=127.0.0.1 \
            -e PORT=5432 \
            -e USER=odoo \
            -e PASSWORD=odoo \
            -v "$PWD:/mnt/current-ai" \
            -v "$PWD/.ci/facodi-learning:/mnt/facodi-learning" \
            facodi-ai-ci \
            odoo shell \
            --db_host=127.0.0.1 \
            --db_port=5432 \
            --db_user=odoo \
            --db_password=odoo \
            --addons-path=/mnt/current-ai,/mnt/facodi-learning,/usr/lib/python3/dist-packages/odoo/addons \
            --database=facodi_ai_bridge_upgrade \
            < scripts/ci_verify_learning_bridge_upgrade.py
